name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release for the version in VERSION'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: ver
        env:
          REF: ${{ github.ref }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_RELEASE: ${{ inputs.release }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
            RELEASE=true
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
            RELEASE=false
            if [[ "$DISPATCH_RELEASE" == "true" ]] || [[ "$COMMIT_MSG" == *"[release]"* ]]; then
              RELEASE=true
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, release: $RELEASE"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName="${{ steps.ver.outputs.version }}" \
            -PversionCode="${{ github.run_number }}" \
            --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "TaskManager-v${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TaskManager-v${{ steps.ver.outputs.version }}
          path: TaskManager-v*.apk

      - name: Publish GitHub release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Task Manager v${{ steps.ver.outputs.version }}
          files: TaskManager-v*.apk
          make_latest: true
          body: |
            A task manager for Android: running apps, live CPU, memory, storage, network and battery graphs, app history, startup apps and device details.

            **Install:** download `TaskManager-v${{ steps.ver.outputs.version }}.apk` below on your phone, open it, and allow installing from your browser or file manager when asked.

            **First run:** tap **Grant usage access** and switch it on for Task Manager. This lets it see which apps are running, plus screen time, data usage and app sizes.

            Requires Android 8.0 or newer.
